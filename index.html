    <style>

        .filter-bar { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 25px; padding: 15px 0; border-bottom: 1px solid #ddd; }

        .filter-bar label { font-weight: 600; margin-right: 6px; color: #2c3e50; }
        .filter-bar select { padding: 6px 12px; border: 1px solid #ccc; border-radius: 6px; min-width: 200px; background: white; }
        .btn-print { background: #1e3c72; color: white; border: none; padding: 8px 24px; border-radius: 30px; font-weight: 500; transition: 0.2s; }
        .btn-print:hover { background: #0f274a; color: #fff; }
        .btn-reset { background: #6c757d; color: white; border: none; padding: 8px 20px; border-radius: 30px; font-weight: 500; }
        .btn-reset:hover { background: #5a6268; color: #fff; }

        /* table */
        .table-responsive { max-height: 550px; overflow-y: auto; border: 1px solid #e9ecef; border-radius: 8px; }

        /* --- HEADER: white background, black text --- */
        .table thead th {
            background: white !important;
            color: black !important;
            border-bottom: 2px solid #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table tbody tr:hover { background: #f1f9ff; }
        .badge-count { background: #1e3c72; color: white; padding: 2px 10px; border-radius: 30px; font-size: 13px; margin-left: 8px; }
        .no-records { text-align: center; padding: 30px; font-size: 16px; color: #888; }
        .footer-meta { margin-top: 12px; display: flex; justify-content: space-between; font-size: 13px; color: #555; }

        /* --- PRINT overrides: remove header background, keep white/black, hide domain --- */
        @media print {
            /* hide filter bar and other non-print elements */
            .filter-bar, .no-print, .btn-print, .btn-reset {
                display: none !important;
            }

            .print-wrapper {
                box-shadow: none;
                padding: 0;
                border-radius: 0;
                background: white;
            }

            .table-responsive {
                max-height: none;
                overflow: visible;
                border: none;
            }

            /* force header white background + black text */
            .table thead th {
                background: white !important;
                color: black !important;
                border-bottom: 2px solid #000 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* remove any URL / domain name that might appear in print header/footer */
            @page {
                margin: 0.5cm;
                /* most browsers remove domain if margin is set, but we also use JS to clear */
            }

            body {
                margin: 0;
                background: white;
            }

            .badge-count { display: none; }
        }
    </style>
</head>

    ];

    // ----------------------------------------------------------------
    // 2. DOM refs
    // ----------------------------------------------------------------
    const tbody = document.getElementById('tableBody');
    const totalRowsDisplay = document.getElementById('totalRowsDisplay');
    const rowCounter = document.getElementById('rowCounter');
    const dateRangeLabel = document.getElementById('dateRangeLabel');
    const generatedTime = document.getElementById('generatedTime');
    const dateSelect = document.getElementById('dateSelect');

    // ----------------------------------------------------------------
    // 3. Helper: get unique dates sorted
    // ----------------------------------------------------------------
    function getUniqueDates(rows) {
        const dates = rows.map(r => r.date);
        const unique = [...new Set(dates)];
        return unique.sort((a, b) => a.localeCompare(b));
    }

    // ----------------------------------------------------------------
    // 4. Render table
    // ----------------------------------------------------------------
    function renderRows(rows) {
        if (!rows || rows.length === 0) {
            tbody.innerHTML = `<tr><td colspan="11" class="no-records">No records found for the selected date.</td></tr>`;
            totalRowsDisplay.textContent = '0';
            rowCounter.textContent = '0 entries';
            dateRangeLabel.textContent = 'No data';
            return;
        }
        let html = '';
        rows.forEach((row, index) => {
            html += `<tr>
                        <td>${index + 1}</td>
                        <td>${row.date}</td>
                        <td>${row.item}</td>
                        <td>${row.qty}</td>
                        <td>${row.rate}</td>
                        <td>${row.amount.toFixed(2)}</td>
                        <td>${row.farmer}</td>
                        <td>${row.phone}</td>
                        <td>${row.address}</td>
                        <td>${row.purpose || ''}</td>
                        <td>${row.remarks || ''}</td>
                    </tr>`;
        });
        tbody.innerHTML = html;
        totalRowsDisplay.textContent = rows.length;
        rowCounter.textContent = rows.length + ' entries';
        const selected = dateSelect.value;
        if (selected) {
            dateRangeLabel.textContent = `Date: ${selected} (${rows.length} rows)`;
        } else {
            dateRangeLabel.textContent = `All dates (${rows.length} rows)`;
        }
    }

    // ----------------------------------------------------------------
    // 5. Filter by selected date
    // ----------------------------------------------------------------
    function filterByDate(dateVal) {
        if (!dateVal) {
            renderRows(rawRows);
            return;
        }
        const filtered = rawRows.filter(row => row.date === dateVal);
        renderRows(filtered);
    }

    // ----------------------------------------------------------------
    // 6. Populate dropdown
    // ----------------------------------------------------------------
    function populateDropdown() {
        const uniqueDates = getUniqueDates(rawRows);
        let options = `<option value="">-- All dates --</option>`;
        uniqueDates.forEach(d => {
            options += `<option value="${d}">${d}</option>`;
        });
        dateSelect.innerHTML = options;
    }

    // ----------------------------------------------------------------
    // 7. Reset
    // ----------------------------------------------------------------
    function resetFilter() {
        dateSelect.value = '';
        renderRows(rawRows);
    }

    // ----------------------------------------------------------------
    // 8. Print handler: remove domain/URL from printed page
    //    We use a small trick: after print dialog opens, we clear the title
    //    and also set @page margin to reduce header/footer.
    //    Also we ensure the domain is not shown by setting a very small margin.
    // ----------------------------------------------------------------
    function handlePrint() {
        // Most browsers show "domain.com - Print" or similar.
        // We can't fully remove it via JS, but we can:
        // 1. Set @page margin: 0.5cm (reduces header/footer space)
        // 2. We already have @page in CSS with margin.
        // 3. Additionally we can change document.title temporarily.
        const originalTitle = document.title;
        document.title = 'Print Report';  // short, no domain

        // Also we can try to hide the URL via a meta tag (not fully supported)
        // but we rely on CSS @page margin.

        window.print();

        // restore title after print (or immediately)
        setTimeout(() => {
            document.title = originalTitle;
        }, 100);
    }

    // ----------------------------------------------------------------
    // 9. INIT
    // ----------------------------------------------------------------
    window.onload = function() {
        populateDropdown();
        renderRows(rawRows);
        generatedTime.textContent = new Date().toLocaleString();

        // event: date select change
        dateSelect.addEventListener('change', function() {
            filterByDate(this.value);
        });

        // reset button
        document.getElementById('resetBtn').addEventListener('click', resetFilter);

        // print button - use custom handler
        document.getElementById('printBtn').addEventListener('click', handlePrint);
    };

})();
</script>
